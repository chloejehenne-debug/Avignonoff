
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avignon Off 2026 — Notre programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
  :root{
    --bg:#EDE8DC;
    --paper:#FBF8F1;
    --ink:#241B2F;
    --ink-soft:#5B5266;
    --primary:#3E4095;
    --primary-dark:#2B2C6B;
    --accent:#F2A93B;
    --stamp:#C1553D;
    --line:rgba(36,27,47,.14);
    --line-strong:rgba(36,27,47,.28);
    --radius:14px;
    --shadow:0 2px 4px rgba(36,27,47,.06), 0 10px 24px -12px rgba(36,27,47,.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 20% 0%, rgba(62,64,149,.06), transparent 45%),
                      radial-gradient(circle at 90% 10%, rgba(242,169,59,.10), transparent 40%);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', serif; margin:0; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color:inherit; }

  #app{ max-width:1180px; margin:0 auto; padding:20px 20px 80px; }

  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; flex-wrap:wrap; padding-bottom:18px; border-bottom:2px solid var(--line-strong);
    margin-bottom:18px;
  }
  .eyebrow{
    display:inline-block; font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.14em;
    color:var(--primary); font-weight:600; margin-bottom:6px;
  }
  .brand h1{ font-size:clamp(28px,4vw,40px); font-weight:700; color:var(--ink); line-height:1.05; }
  .whoami{
    display:flex; align-items:center; gap:10px; background:var(--paper); border:1px solid var(--line);
    padding:10px 14px; border-radius:999px; box-shadow:var(--shadow);
  }
  .whoami label{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  select, input[type=text], input[type=search], input[type=url], input[type=number], input[type=time], textarea{
    font-family:'Work Sans', sans-serif; font-size:14px; color:var(--ink);
    background:#fff; border:1px solid var(--line-strong); border-radius:9px;
    padding:8px 10px; outline:none;
  }
  select:focus, input:focus, textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 3px rgba(62,64,149,.15); }
  .linklike{
    background:none; border:none; color:var(--primary); font-weight:600; font-size:12.5px;
    text-decoration:underline; cursor:pointer; padding:2px 4px;
  }

  .daytabs{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .daytab{
    font-family:'IBM Plex Mono'; font-size:13px; font-weight:600; letter-spacing:.03em;
    background:var(--paper); border:1px solid var(--line-strong); color:var(--ink-soft);
    padding:9px 16px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .daytab .count{ background:var(--line); border-radius:999px; padding:1px 7px; font-size:11px; }
  .daytab.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .daytab.active .count{ background:rgba(255,255,255,.25); }
  .refresh-btn{
    margin-left:auto; background:var(--paper); border:1px solid var(--line-strong); border-radius:999px;
    padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-soft);
  }
  .sync-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; background:#8FBF6B; }
  .sync-dot.off{ background:var(--stamp); }

  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px;
  }
  .toolbar input[type=search]{ flex:1; min-width:180px; }
  .minvotes{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .minvotes input{ width:56px; }
  .btn{
    font-family:'Work Sans'; font-weight:600; font-size:13.5px; border-radius:9px; border:1px solid var(--line-strong);
    background:#fff; color:var(--ink); padding:9px 14px; cursor:pointer; white-space:nowrap;
  }
  .btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn.primary:hover{ background:var(--primary-dark); }
  .btn.ghost{ background:transparent; border-color:transparent; }
  .btn:hover{ filter:brightness(0.98); }

  .cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(310px,1fr)); gap:18px; }
  .empty{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--ink-soft);
    background:var(--paper); border:1px dashed var(--line-strong); border-radius:var(--radius);
  }

  .card{
    display:flex; background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden; position:relative; border:1px solid var(--line);
  }
  .stub{
    width:78px; flex-shrink:0; background:var(--primary); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; padding:10px 4px; text-align:center;
  }
  .stub::before{
    content:""; position:absolute; left:-6px; top:0; bottom:0; width:12px;
    background-image:radial-gradient(circle at 6px 0, transparent 6px, var(--paper) 6.5px);
    background-size:12px 18px; background-repeat:repeat-y;
  }
  .stub::after{
    content:""; position:absolute; right:0; top:8px; bottom:8px; border-left:2px dashed rgba(255,255,255,.45);
  }
  .stub .time{ font-family:'IBM Plex Mono'; font-weight:600; font-size:17px; line-height:1.1; }
  .stub .duration{ font-family:'IBM Plex Mono'; font-size:10px; opacity:.85; margin-top:2px; }
  .stub .day{ font-family:'IBM Plex Mono'; font-size:10px; opacity:.8; margin-top:4px; letter-spacing:.04em; line-height:1.3; word-break:break-word; }

  .view-switch{ display:flex; border:1px solid var(--line-strong); border-radius:9px; overflow:hidden; }
  .view-switch button{
    font-family:'Work Sans'; font-weight:600; font-size:13px; padding:8px 13px; border:none; background:#fff;
    color:var(--ink-soft); cursor:pointer;
  }
  .view-switch button.active{ background:var(--primary); color:#fff; }

  .table-wrap{ overflow-x:auto; background:var(--paper); border-radius:var(--radius); border:1px solid var(--line); box-shadow:var(--shadow); }
  table.shows-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.shows-table th{
    text-align:left; font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.04em; color:var(--ink-soft);
    padding:12px 14px; border-bottom:2px solid var(--line-strong); white-space:nowrap;
  }
  table.shows-table td{ padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.shows-table tr:last-child td{ border-bottom:none; }
  table.shows-table td.col-time{ font-family:'IBM Plex Mono'; font-weight:600; white-space:nowrap; }

  .map-view{ height:560px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow); }
  .map-unsure-note{ margin-top:10px; font-size:12px; color:var(--ink-soft); font-style:italic; }
  .leaflet-popup-content{ font-family:'Work Sans'; font-size:13px; }
  .leaflet-popup-content strong{ font-family:'Fraunces'; font-size:14.5px; }

  .card-body{ flex:1; padding:14px 16px 12px; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .card-top{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .card-title h3{ font-size:17px; font-weight:600; line-height:1.2; }
  .card-company{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .card-menu{ position:relative; flex-shrink:0; }
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:16px; padding:2px 5px; border-radius:6px;
  }
  .icon-btn:hover{ background:var(--line); color:var(--ink); }
  .dropdown{
    position:absolute; right:0; top:26px; background:#fff; border:1px solid var(--line-strong); border-radius:10px;
    box-shadow:var(--shadow); z-index:20; min-width:170px; overflow:hidden; display:none;
  }
  .dropdown.open{ display:block; }
  .dropdown button{
    display:block; width:100%; text-align:left; background:none; border:none; padding:9px 12px; font-size:13px;
    cursor:pointer; color:var(--ink);
  }
  .dropdown button:hover{ background:var(--bg); }
  .dropdown .divider{ height:1px; background:var(--line); margin:2px 0; }

  .card-theatre{ font-size:13px; color:var(--ink); }
  .card-address{ font-size:12px; color:var(--ink-soft); text-decoration:none; }
  .card-address:hover{ text-decoration:underline; }
  .card-address.unsure{ color:var(--stamp); font-style:italic; }
  .summary-toggle{
    display:flex; align-items:center; gap:4px; background:none; border:none; cursor:pointer;
    font-family:'Work Sans'; font-weight:600; font-size:12px; color:var(--primary); padding:2px 0; width:fit-content;
  }
  .summary-toggle .chevron{ transition:transform .15s ease; font-size:10px; }
  .summary-toggle.open .chevron{ transform:rotate(180deg); }
  .card-summary{
    font-size:12.5px; line-height:1.5; color:var(--ink-soft); background:var(--bg); border-radius:8px;
    padding:8px 10px; margin-top:2px;
  }
  .availability-link{
    display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; color:var(--primary);
    text-decoration:none; width:fit-content; margin-top:2px;
  }
  .availability-link:hover{ text-decoration:underline; }
  .photo-thumb{
    width:100%; max-height:130px; object-fit:cover; border-radius:8px; border:1px solid var(--line); cursor:zoom-in;
  }

  .card-bottom{
    margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:10px;
    border-top:1px dashed var(--line-strong);
  }
  .vote-counter{
    font-family:'IBM Plex Mono'; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
    border:1.5px solid var(--line-strong); background:#fff; color:var(--ink-soft); cursor:pointer;
    border-radius:999px; padding:6px 13px; transition:transform .12s ease, background .12s ease;
  }
  .vote-counter:hover{ transform:scale(1.05); }
  .vote-counter.voted{ background:var(--stamp); border-color:var(--stamp); color:#fff; }
  .vote-counter .heart{ font-size:13px; }

  .reserve-link{
    font-family:'Work Sans'; font-weight:600; font-size:12.5px; text-decoration:none; color:#fff;
    background:var(--accent); padding:7px 12px; border-radius:8px; white-space:nowrap;
  }
  .reserve-missing{
    font-size:11.5px; color:var(--ink-soft); font-style:italic; cursor:pointer; text-decoration:underline;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(36,27,47,.45); display:flex; align-items:flex-start; justify-content:center;
    padding:30px 16px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:var(--paper); border-radius:16px; max-width:560px; width:100%; box-shadow:var(--shadow); padding:22px 24px 26px;
  }
  .modal h2{ font-size:22px; margin-bottom:4px; }
  .modal .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:16px; }
  .tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .tab-btn{
    flex:1; font-weight:600; font-size:13px; padding:9px; border-radius:9px; border:1px solid var(--line-strong);
    background:#fff; cursor:pointer; color:var(--ink-soft);
  }
  .tab-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select, .field textarea{ width:100%; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .daychecks{ display:flex; gap:14px; flex-wrap:wrap; }
  .daychecks label{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:500; color:var(--ink); }
  .photo-drop{
    border:2px dashed var(--line-strong); border-radius:12px; padding:18px; text-align:center; color:var(--ink-soft);
    font-size:13px; margin-bottom:14px; cursor:pointer; background:#fff;
  }
  .photo-preview{ max-width:100%; max-height:220px; border-radius:10px; margin-top:10px; display:block; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  .voter-edit-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .voter-edit-row .v-name{ flex:1.2; }
  .voter-edit-row .v-card{ flex:1; }
  .voter-edit-row .v-remove{ flex-shrink:0; }
  .voter-edit-row .v-copy{ flex-shrink:0; }
  .voter-edit-row input{ flex:1; }

  .lightbox{
    position:fixed; inset:0; background:rgba(20,15,25,.85); display:flex; align-items:center; justify-content:center;
    z-index:200; padding:24px; cursor:zoom-out;
  }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:10px; }

  .hidden{ display:none !important; }
  .loading-state{ text-align:center; padding:60px 0; color:var(--ink-soft); font-size:14px; }

  .setup-banner{
    max-width:640px; margin:60px auto; background:var(--paper); border:1px solid var(--line-strong);
    border-radius:16px; padding:26px 28px; box-shadow:var(--shadow); font-size:14px; line-height:1.6;
  }
  .setup-banner h2{ font-size:22px; margin-bottom:10px; }
  .setup-banner code{
    background:#fff; border:1px solid var(--line); padding:2px 6px; border-radius:6px; font-family:'IBM Plex Mono';
    font-size:12.5px;
  }

  .voter-gate{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
    z-index:150; padding:20px;
  }
  .voter-gate-card{
    background:var(--paper); border:1px solid var(--line-strong); border-radius:16px; padding:34px 30px;
    max-width:420px; width:100%; box-shadow:var(--shadow); text-align:center;
  }
  .voter-gate-card .eyebrow{ display:block; margin-bottom:10px; }
  .voter-gate-card h2{ font-size:24px; margin-bottom:6px; }
  .voter-gate-card .sub{ font-size:13px; color:var(--ink-soft); margin-bottom:22px; }
  .voter-gate-grid{ display:flex; flex-direction:column; gap:10px; }
  .voter-gate-grid button{
    font-family:'Work Sans'; font-weight:600; font-size:15px; padding:12px; border-radius:10px;
    border:1.5px solid var(--line-strong); background:#fff; cursor:pointer; color:var(--ink); transition:.12s ease;
  }
  .voter-gate-grid button:hover{ background:var(--primary); color:#fff; border-color:var(--primary); }

  @media (max-width:560px){
    .whoami{ width:100%; justify-content:space-between; }
    .toolbar{ width:100%; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="eyebrow">FESTIVAL OFF D'AVIGNON · 60ᵉ ÉDITION</span>
      <h1>Notre programme</h1>
    </div>
    <div class="whoami">
      <label>Qui es-tu ?</label>
      <select id="voterSelect"></select>
      <button class="icon-btn" id="copyMyCardBtn" title="Copier mon numéro de carte">📋</button>
      <button class="linklike" id="copyAllCardsBtn">copier tout</button>
      <button class="linklike" id="editVotersBtn">noms</button>
    </div>
  </header>

  <nav class="daytabs" id="dayTabs">
    <button class="refresh-btn" id="refreshBtn" style="display:none;"><span class="sync-dot" id="syncDot"></span>Actualiser</button>
  </nav>

  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Chercher un spectacle ou une compagnie…">
    <select id="theatreFilter"></select>
    <select id="timeRangeFilter">
      <option value="">Toute la journée</option>
      <option value="morning">Avant 14h</option>
      <option value="afternoon">14h – 19h</option>
      <option value="evening">Après 19h</option>
    </select>
    <select id="sortSelect">
      <option value="votes" selected>Trier par nombre de votes</option>
      <option value="time">Trier par heure</option>
      <option value="name">Trier par nom</option>
    </select>
    <div class="view-switch" id="viewSwitch">
      <button data-view="cards" class="active">Fiches</button>
      <button data-view="table">Tableau</button>
      <button data-view="map">Carte</button>
    </div>
    <button class="btn primary" id="addBtn">+ Ajouter un spectacle</button>
  </div>

  <main id="cards" class="cards"><div class="loading-state">Chargement du programme…</div></main>
</div>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  // ============================================================
  // CONFIGURATION SUPABASE — à remplir une seule fois
  // ============================================================
  const SUPABASE_URL = "https://znngdvphctrtfsejmeqd.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpubmdkdnBoY3RydGZzZWptZXFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwNDU0NjUsImV4cCI6MjA5OTYyMTQ2NX0.ZMrktjaCiAT9z8Bvj5FLHBYGQTHI2NyDjYuR3D9-708";
  const PHOTO_BUCKET = "flyers";
  // ============================================================

  const DAYS = [
    {key:"17", label:"Ven. 17 juillet"},
    {key:"18", label:"Sam. 18 juillet"},
    {key:"19", label:"Dim. 19 juillet"}
  ];

  let supabase = null;
  let state = {
    shows: [],
    voters: [
      {id:"0", name:"Perso 1", card:""},
      {id:"1", name:"Perso 2", card:""},
      {id:"2", name:"Perso 3", card:""},
      {id:"3", name:"Perso 4", card:""},
      {id:"4", name:"Perso 5", card:""}
    ],
    currentDay: "17",
    currentVoter: "0",
    viewMode: "cards",
    votesByKey: {},
    theatres: []
  };

  function normalizeVoters(raw){
    if(!Array.isArray(raw) || raw.length===0){
      return [
        {id:"0", name:"Perso 1", card:""},
        {id:"1", name:"Perso 2", card:""},
        {id:"2", name:"Perso 3", card:""},
        {id:"3", name:"Perso 4", card:""},
        {id:"4", name:"Perso 5", card:""}
      ];
    }
    return raw.map((v,i)=>{
      if(typeof v === "string") return {id:String(i), name:v, card:""};
      return {id: v.id!=null ? String(v.id) : String(i), name: v.name||"Perso", card: v.card||""};
    });
  }

  function voterUid(){ return "v" + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

  function timeBucket(time){
    if(!time) return "";
    const hour = parseInt(time.split(":")[0], 10);
    if(isNaN(hour)) return "";
    if(hour < 14) return "morning";
    if(hour < 19) return "afternoon";
    return "evening";
  }

  function mapsUrl(address){
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address);
  }

  const geocodeCache = {};
  let leafletMap = null;
  let mapRenderToken = 0;
  function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

  async function geocodeAddress(address, attempt){
    attempt = attempt || 1;
    if(geocodeCache[address]) return geocodeCache[address];
    try{
      const query = /france/i.test(address) ? address : address + ", France";
      const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(query);
      const res = await fetch(url);
      if(res.status === 429 && attempt < 3){
        await sleep(1500 * attempt);
        return geocodeAddress(address, attempt + 1);
      }
      const data = await res.json();
      await sleep(400);
      if(data && data[0]){
        const coords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        geocodeCache[address] = coords;
        return coords;
      }
      if(attempt < 2){
        await sleep(1000);
        return geocodeAddress(address, attempt + 1);
      }
    }catch(e){
      console.warn("Géocodage échoué pour", address, e);
      if(attempt < 2){ await sleep(1000); return geocodeAddress(address, attempt + 1); }
    }
    return null;
  }

  function cacheCoordsForSameName(show, lat, lng){
    const key = showKey(show.name);
    state.shows
      .filter(s => showKey(s.name) === key && (s.lat==null || s.lng==null))
      .forEach(s => {
        s.lat = lat; s.lng = lng;
        updateShowSilent(s.id, { lat, lng });
      });
    if(show.theatre){
      const theatreKey = show.theatre.trim().toLowerCase();
      const theatre = state.theatres.find(t => t.name.trim().toLowerCase() === theatreKey);
      if(theatre && (theatre.lat==null || theatre.lng==null)){
        theatre.lat = lat; theatre.lng = lng;
        upsertTheatre(theatre);
      }
    }
  }

  function isConfigured(){
    return SUPABASE_URL.indexOf("supabase.co") !== -1 && SUPABASE_ANON_KEY.length > 20;
  }

  function uid(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(str){
    return String(str||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function showKey(name){ return (name||"").trim().toLowerCase(); }
  function votesFor(show){ return state.votesByKey[showKey(show.name)] || {}; }
  function voteCount(show){ return Object.values(votesFor(show)).filter(Boolean).length; }

  // ---------- setup banner if not configured ----------
  function renderSetupBanner(){
    document.getElementById("app").innerHTML = `
      <div class="setup-banner">
        <h2>⚙️ Configuration Supabase requise</h2>
        <p>Cette page a besoin de ton URL et de ta clé publique <strong>anon</strong> Supabase pour fonctionner.
        Ouvre le fichier HTML, repère les deux constantes en haut du script :</p>
        <p><code>SUPABASE_URL</code> et <code>SUPABASE_ANON_KEY</code></p>
        <p>remplace-les par les valeurs de ton projet (Project Settings → API), enregistre, et recharge la page.
        Tu n'auras besoin de le faire qu'une seule fois.</p>
      </div>`;
  }

  // ---------- data access ----------
  async function loadShows(){
    const { data, error } = await supabase.from("shows").select("*");
    if(error){ console.error(error); alert("Impossible de charger les spectacles depuis Supabase : " + error.message); return []; }
    return data || [];
  }
  async function loadVotesByKey(){
    const { data, error } = await supabase.from("show_votes").select("*");
    if(error){
      console.error(error);
      alert("Impossible de charger les votes (table 'show_votes' introuvable ?) : " + error.message);
      return {};
    }
    const map = {};
    (data||[]).forEach(row => { map[row.key] = row.votes || {}; });
    return map;
  }
  async function saveVotesForKey(key, votes){
    const { error } = await supabase.from("show_votes").upsert({ key, votes });
    if(error){ console.error(error); alert("Impossible d'enregistrer le vote : " + error.message); }
  }
  async function loadTheatres(){
    const { data, error } = await supabase.from("theatres").select("*");
    if(error){ console.warn("Table 'theatres' introuvable :", error.message); return []; }
    return data || [];
  }
  async function upsertTheatre(theatre){
    const { error } = await supabase.from("theatres").upsert(theatre);
    if(error){ console.warn("Impossible d'enregistrer le théâtre :", error.message); }
  }
  async function insertShow(show){
    const { error } = await supabase.from("shows").insert([show]);
    if(error){ console.error(error); alert("Impossible d'ajouter ce spectacle : " + error.message); }
  }
  async function updateShow(id, fields){
    const { error } = await supabase.from("shows").update(fields).eq("id", id);
    if(error){ console.error(error); alert("Impossible d'enregistrer : " + error.message); }
  }
  async function updateShowSilent(id, fields){
    const { error } = await supabase.from("shows").update(fields).eq("id", id);
    if(error){ console.warn("Sauvegarde silencieuse échouée pour", id, error.message); }
  }
  async function deleteShowRow(id){
    const { error } = await supabase.from("shows").delete().eq("id", id);
    if(error){ console.error(error); alert("Impossible de supprimer : " + error.message); }
  }
  async function loadVoters(){
    const { data, error } = await supabase.from("app_config").select("value").eq("key","voters").single();
    if(error){ console.error(error); return normalizeVoters(null); }
    return normalizeVoters(data.value);
  }
  async function saveVoters(){
    const { error } = await supabase.from("app_config").update({ value: state.voters }).eq("key","voters");
    if(error){ console.error(error); alert("Impossible d'enregistrer les noms : " + error.message); }
  }
  async function uploadPhoto(id, blob){
    const path = id + ".jpg";
    const { error } = await supabase.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType:"image/jpeg", upsert:true });
    if(error){ console.error(error); alert("Impossible d'envoyer la photo : " + error.message); return null; }
    const { data } = supabase.storage.from(PHOTO_BUCKET).getPublicUrl(path);
    return data.publicUrl;
  }
  async function deletePhoto(id){
    try{ await supabase.storage.from(PHOTO_BUCKET).remove([id + ".jpg"]); }catch(e){ console.warn(e); }
  }

  // ---------- init ----------
  async function init(){
    if(!isConfigured()){ renderSetupBanner(); return; }
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const [shows, voters, votesByKey, theatres] = await Promise.all([loadShows(), loadVoters(), loadVotesByKey(), loadTheatres()]);
    state.shows = shows;
    state.voters = voters;
    state.votesByKey = votesByKey;
    state.theatres = theatres;
    if(!state.voters.some(v=>v.id===state.currentVoter)) state.currentVoter = state.voters[0].id;

    renderVoterSelect();
    renderDayTabs();
    renderTheatreFilter();
    renderCards();
    bindStaticEvents();
    subscribeRealtime();
    showVoterGate();
  }

  function showVoterGate(){
    const div = document.createElement("div");
    div.className = "voter-gate";
    div.id = "voterGate";
    div.innerHTML = `
      <div class="voter-gate-card">
        <span class="eyebrow">FESTIVAL OFF D'AVIGNON</span>
        <h2>Qui es-tu ?</h2>
        <div class="sub">Choisis ton profil pour voter sur les spectacles.</div>
        <div class="voter-gate-grid">
          ${state.voters.map(v=>`<button data-id="${escapeHtml(v.id)}">${escapeHtml(v.name)}</button>`).join("")}
        </div>
      </div>`;
    document.body.appendChild(div);
    div.querySelectorAll("button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.currentVoter = btn.dataset.id;
        renderVoterSelect();
        renderCards();
        div.remove();
      });
    });
  }

  function subscribeRealtime(){
    try{
      supabase.channel("shows-changes")
        .on("postgres_changes", { event:"*", schema:"public", table:"shows" }, async () => {
          state.shows = await loadShows();
          renderDayTabs(); renderTheatreFilter(); renderCards();
        })
        .subscribe((status)=>{
          const dot = document.getElementById("syncDot");
          if(dot) dot.classList.toggle("off", status !== "SUBSCRIBED");
        });
      supabase.channel("config-changes")
        .on("postgres_changes", { event:"*", schema:"public", table:"app_config" }, async () => {
          state.voters = await loadVoters();
          renderVoterSelect(); renderCards();
        })
        .subscribe();
      supabase.channel("votes-changes")
        .on("postgres_changes", { event:"*", schema:"public", table:"show_votes" }, async () => {
          state.votesByKey = await loadVotesByKey();
          renderCards();
        })
        .subscribe();
      document.getElementById("refreshBtn").style.display = "none";
    }catch(e){
      console.warn("Realtime indisponible, utilise le bouton Actualiser.", e);
      document.getElementById("refreshBtn").style.display = "inline-flex";
    }
  }

  async function refreshAll(){
    state.shows = await loadShows();
    state.voters = await loadVoters();
    state.votesByKey = await loadVotesByKey();
    state.theatres = await loadTheatres();
    renderVoterSelect(); renderDayTabs(); renderTheatreFilter(); renderCards();
  }

  // ---------- rendering ----------
  function renderDayTabs(){
    const nav = document.getElementById("dayTabs");
    const refreshBtn = document.getElementById("refreshBtn").outerHTML;
    const uniqueShowCount = new Set(state.shows.map(s => showKey(s.name))).size;
    const allTab = `<button class="daytab ${state.currentDay==='all'?'active':''}" data-day="all">
      Tous les jours <span class="count">${uniqueShowCount}</span>
    </button>`;
    nav.innerHTML = allTab + DAYS.map(d=>{
      const count = state.shows.filter(s=>s.day===d.key).length;
      return `<button class="daytab ${d.key===state.currentDay?'active':''}" data-day="${d.key}">
        ${d.label} <span class="count">${count}</span>
      </button>`;
    }).join("") + refreshBtn;
    nav.querySelectorAll(".daytab").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.currentDay = btn.dataset.day; renderDayTabs(); renderCards(); });
    });
    document.getElementById("refreshBtn").addEventListener("click", refreshAll);
  }

  function renderVoterSelect(){
    const sel = document.getElementById("voterSelect");
    sel.innerHTML = state.voters.map(v=>`<option value="${escapeHtml(v.id)}">${escapeHtml(v.name)}</option>`).join("");
    sel.value = state.currentVoter;
  }

  function renderTheatreFilter(){
    const sel = document.getElementById("theatreFilter");
    const theatres = Array.from(new Set(state.shows.map(s=>s.theatre).filter(Boolean))).sort((a,b)=>a.localeCompare(b));
    sel.innerHTML = `<option value="">Tous les théâtres</option>` + theatres.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join("");
  }

  function mergeSameNameShows(list){
    const seen = new Map();
    const merged = [];
    list.forEach(s=>{
      const key = s.name.trim().toLowerCase();
      if(seen.has(key)){
        seen.get(key).__days.push(s.day);
      } else {
        const copy = Object.assign({}, s, { __days: [s.day] });
        seen.set(key, copy);
        merged.push(copy);
      }
    });
    merged.forEach(s => s.__days.sort());
    return merged;
  }

  function dayBadgeHtml(s){
    const days = s.__days || [s.day];
    if(days.length > 1) return days.join(" · ");
    const d = DAYS.find(x=>x.key===days[0]);
    return d ? d.label.replace("Ven. ","V ").replace("Sam. ","S ").replace("Dim. ","D ") : days[0];
  }

  function getFiltered(){
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const theatre = document.getElementById("theatreFilter").value;
    const timeRange = document.getElementById("timeRangeFilter").value;
    const sortBy = document.getElementById("sortSelect").value;

    let list = state.currentDay === "all" ? state.shows.slice() : state.shows.filter(s => s.day === state.currentDay);
    if(q) list = list.filter(s => (s.name+" "+(s.company||"")).toLowerCase().includes(q));
    if(theatre) list = list.filter(s => s.theatre === theatre);
    if(timeRange) list = list.filter(s => timeBucket(s.time) === timeRange);

    if(state.currentDay === "all") list = mergeSameNameShows(list);

    list.sort((a,b)=>{
      if(sortBy==="votes") return voteCount(b) - voteCount(a);
      if(sortBy==="name") return a.name.localeCompare(b.name);
      return (a.time||"").localeCompare(b.time||"");
    });
    return list;
  }

  function renderCards(){
    const wrap = document.getElementById("cards");
    const list = getFiltered();
    if(list.length===0){
      wrap.className = "cards";
      wrap.innerHTML = `<div class="empty">Aucun spectacle ne correspond à ces filtres pour ce jour.<br>Essaie d'élargir la recherche ou d'ajouter un spectacle.</div>`;
      return;
    }
    if(state.viewMode === "table"){
      wrap.className = "";
      wrap.innerHTML = tableHtml(list);
    } else if(state.viewMode === "map"){
      renderMapView(list);
      return;
    } else {
      wrap.className = "cards";
      wrap.innerHTML = list.map(cardHtml).join("");
    }
    bindCardEvents();
  }

  function renderMapView(list){
    const myToken = ++mapRenderToken;
    const wrap = document.getElementById("cards");

    if(leafletMap){ try{ leafletMap.remove(); }catch(e){} leafletMap = null; }
    wrap.className = "";
    wrap.innerHTML = `<div id="mapView" class="map-view"></div><div id="mapUnsure"></div>`;

    const map = L.map("mapView").setView([43.9493, 4.8055], 15);
    leafletMap = map;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 19
    }).addTo(map);
    setTimeout(()=>{ if(mapRenderToken===myToken) map.invalidateSize(); }, 60);

    (async ()=>{
      const bounds = [];
      const unresolved = [];
      for(const s of list){
        if(mapRenderToken !== myToken) return; // a newer render started meanwhile, abandon this one
        if(!s.address || /confirmer/i.test(s.address)){ unresolved.push(s); continue; }
        const theatreMatch = s.theatre ? state.theatres.find(t => t.name.trim().toLowerCase() === s.theatre.trim().toLowerCase()) : null;
        let coords = (s.lat!=null && s.lng!=null) ? { lat:s.lat, lng:s.lng }
          : (theatreMatch && theatreMatch.lat!=null && theatreMatch.lng!=null) ? { lat:theatreMatch.lat, lng:theatreMatch.lng }
          : await geocodeAddress(s.address);
        if(mapRenderToken !== myToken) return;
        if(!coords){ unresolved.push(s); continue; }
        if(s.lat==null || s.lng==null){
          cacheCoordsForSameName(s, coords.lat, coords.lng);
        }
        const marker = L.marker([coords.lat, coords.lng]).addTo(map);
        marker.bindPopup(`<strong>${escapeHtml(s.name)}</strong><br>${escapeHtml(s.theatre||"")}<br>${escapeHtml(s.time||"")} — ${escapeHtml(dayBadgeHtml(s))}`);
        bounds.push([coords.lat, coords.lng]);
      }
      if(mapRenderToken !== myToken) return;
      if(bounds.length) map.fitBounds(bounds, { padding:[30,30] });
      const unsureDiv = document.getElementById("mapUnsure");
      if(unsureDiv && unresolved.length){
        unsureDiv.innerHTML = `<div class="map-unsure-note">Adresse non localisée sur la carte pour : ${unresolved.map(s=>escapeHtml(s.name)).join(", ")}</div>`;
      }
    })();
  }

  function addressLinkHtml(s, extraClass){
    if(!s.address) return "";
    const cls = "card-address" + (s.address_unsure ? " unsure" : "") + (extraClass ? " " + extraClass : "");
    return `<a class="${cls}" href="${mapsUrl(s.address)}" target="_blank" rel="noopener">${escapeHtml(s.address)}</a>`;
  }

  function tableHtml(list){
    const rows = list.map(s => `
      <tr data-id="${s.id}">
        <td>${escapeHtml(s.name)}</td>
        <td>${escapeHtml(s.theatre||"")}</td>
        <td>${addressLinkHtml(s)}</td>
        <td class="col-time">${escapeHtml(dayBadgeHtml(s))}</td>
        <td class="col-time">${escapeHtml(s.time||"—")}</td>
        <td class="col-time">♥ ${voteCount(s)}</td>
      </tr>`).join("");
    return `
      <div class="table-wrap">
        <table class="shows-table">
          <thead><tr><th>Nom</th><th>Théâtre</th><th>Adresse</th><th>Jour</th><th>Heure</th><th>Votes</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function cardHtml(s){
    const dayLabel = dayBadgeHtml(s);
    const votes = votesFor(s);
    const count = voteCount(s);
    const iVoted = !!votes[state.currentVoter];
    const votedNames = state.voters.filter(v=>!!votes[v.id]).map(v=>v.name);
    const voteTitle = votedNames.length ? "A voté : " + votedNames.join(", ") : "Personne n'a encore voté";

    const photoHtml = s.photo_url ? `<img class="photo-thumb" data-id="${s.id}" src="${escapeHtml(s.photo_url)}" alt="Flyer de ${escapeHtml(s.name)}">` : "";
    const durationHtml = s.duration ? `<div class="duration mono">${escapeHtml(s.duration)}</div>` : "";
    const summaryHtml = s.summary
      ? `<button class="summary-toggle" data-id="${s.id}">Résumé <span class="chevron">▾</span></button>
         <div class="card-summary hidden" id="summary-${s.id}">${escapeHtml(s.summary)}</div>`
      : "";

    const bookingUrl = s.link && s.link.includes("festivaloffavignon.com/spectacles/") && !s.link.includes("/representations/")
      ? s.link.replace("festivaloffavignon.com/spectacles/", "festivaloffavignon.com/spectacles/representations/")
      : s.link;

    const reserveHtml = bookingUrl
      ? `<a class="reserve-link" href="${escapeHtml(bookingUrl)}" target="_blank" rel="noopener">Réserver ↗</a>`
      : `<span class="reserve-missing" data-edit-id="${s.id}">+ ajouter un lien</span>`;

    return `
    <article class="card" data-id="${s.id}">
      <div class="stub">
        <div class="time mono">${escapeHtml(s.time||"—")}</div>
        ${durationHtml}
        <div class="day">${escapeHtml(dayLabel)}</div>
      </div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-title">
            <h3>${escapeHtml(s.name)}</h3>
          </div>
          <div class="card-menu">
            <button class="icon-btn menu-toggle" data-id="${s.id}">⋯</button>
            <div class="dropdown" data-menu-for="${s.id}">
              <button data-action="edit" data-id="${s.id}">✏️ Modifier</button>
              <div class="divider"></div>
              <button data-action="delete" data-id="${s.id}">🗑 Supprimer</button>
            </div>
          </div>
        </div>
        <div class="card-theatre">${escapeHtml(s.theatre)}</div>
        ${addressLinkHtml(s)}
        ${photoHtml}
        ${summaryHtml}
        <div class="card-bottom">
          <button class="vote-counter ${iVoted?'voted':''}" data-id="${s.id}" title="${escapeHtml(voteTitle)}">
            <span class="heart">♥</span><span>${count}</span>
          </button>
          ${reserveHtml}
        </div>
      </div>
    </article>`;
  }

  // ---------- events ----------
  function bindStaticEvents(){
    document.getElementById("voterSelect").addEventListener("change", e=>{ state.currentVoter = e.target.value; renderCards(); });
    document.getElementById("copyMyCardBtn").addEventListener("click", (e)=>{
      const voter = state.voters.find(v=>v.id===state.currentVoter);
      if(!voter || !(voter.card||"").trim()){ alert("Aucun numéro de carte enregistré pour toi. Ajoute-le via \"noms\"."); return; }
      copyToClipboard(voter.card.trim(), e.currentTarget);
    });
    document.getElementById("copyAllCardsBtn").addEventListener("click", (e)=>{
      const text = state.voters
        .filter(v=>(v.card||"").trim())
        .slice()
        .sort((a,b)=>a.name.localeCompare(b.name))
        .map(v=>`${v.name}: ${v.card.trim()}`).join("\n");
      if(!text){ alert("Aucun numéro de carte renseigné pour l'instant."); return; }
      copyToClipboard(text, e.currentTarget);
    });
    document.getElementById("editVotersBtn").addEventListener("click", openVoterModal);
    document.getElementById("searchInput").addEventListener("input", renderCards);
    document.getElementById("theatreFilter").addEventListener("change", renderCards);
    document.getElementById("timeRangeFilter").addEventListener("change", renderCards);
    document.getElementById("sortSelect").addEventListener("change", renderCards);
    document.getElementById("addBtn").addEventListener("click", ()=>openShowModal(null));
    document.querySelectorAll("#viewSwitch button").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        state.viewMode = btn.dataset.view;
        document.querySelectorAll("#viewSwitch button").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        renderCards();
      });
    });
    document.addEventListener("click", (e)=>{
      if(!e.target.closest(".card-menu")){
        document.querySelectorAll(".dropdown.open").forEach(d=>d.classList.remove("open"));
      }
    });
  }

  function bindCardEvents(){
    const wrap = document.getElementById("cards");

    wrap.querySelectorAll(".summary-toggle").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.id;
        const panel = document.getElementById("summary-"+id);
        if(!panel) return;
        const isOpen = !panel.classList.contains("hidden");
        panel.classList.toggle("hidden", isOpen);
        btn.classList.toggle("open", !isOpen);
      });
    });

    wrap.querySelectorAll(".vote-counter").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id = btn.dataset.id;
        const show = state.shows.find(s=>s.id===id);
        if(!show) return;
        const key = showKey(show.name);
        const votes = Object.assign({}, state.votesByKey[key] || {});
        votes[state.currentVoter] = !votes[state.currentVoter];
        state.votesByKey[key] = votes;
        renderCards();
        await saveVotesForKey(key, votes);
      });
    });

    wrap.querySelectorAll(".menu-toggle").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        const id = btn.dataset.id;
        document.querySelectorAll(".dropdown.open").forEach(d=>{ if(d.dataset.menuFor!==id) d.classList.remove("open"); });
        const dd = wrap.querySelector(`.dropdown[data-menu-for="${id}"]`);
        dd.classList.toggle("open");
      });
    });

    wrap.querySelectorAll("[data-action]").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.stopPropagation();
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        document.querySelectorAll(".dropdown.open").forEach(d=>d.classList.remove("open"));
        if(action==="edit") openShowModal(id);
        if(action==="delete") await deleteShow(id);
      });
    });

    wrap.querySelectorAll(".reserve-missing").forEach(el=>{
      el.addEventListener("click", ()=> openShowModal(el.dataset.editId));
    });

    wrap.querySelectorAll(".photo-thumb").forEach(img=>{
      img.addEventListener("click", ()=> openLightbox(img.src));
    });
  }

  async function deleteShow(id){
    const show = state.shows.find(s=>s.id===id);
    if(!show) return;
    if(!confirm(`Supprimer "${show.name}" (${DAYS.find(d=>d.key===show.day).label}) ?`)) return;
    await deleteShowRow(id);
    if(show.photo_url) await deletePhoto(id);
    state.shows = state.shows.filter(s=>s.id!==id);
    renderDayTabs();
    renderTheatreFilter();
    renderCards();
  }

  function openLightbox(src){
    const div = document.createElement("div");
    div.className = "lightbox";
    div.innerHTML = `<img src="${src}">`;
    div.addEventListener("click", ()=>div.remove());
    document.body.appendChild(div);
  }

  function copyToClipboard(text, btn){
    if(!text){ return; }
    navigator.clipboard.writeText(text).then(()=>{
      if(btn){
        const original = btn.textContent;
        btn.textContent = "✓";
        setTimeout(()=>{ btn.textContent = original; }, 1200);
      }
    }).catch(()=>{ alert("Impossible de copier automatiquement, sélectionne le texte manuellement."); });
  }

  // ---------- voter name modal ----------
  function openVoterModal(){
    const root = document.getElementById("modalRoot");
    root.innerHTML = `
      <div class="overlay" id="voterOverlay">
        <div class="modal">
          <h2>Le groupe</h2>
          <div class="sub">Nom et n° de carte off (facultatif) pour chaque personne.</div>
          <div id="voterRows"></div>
          <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
            <button class="btn" id="voterAddBtn">+ Ajouter une personne</button>
            <button class="btn" id="voterCopyAllBtn">📋 Copier tous les numéros</button>
          </div>
          <div class="modal-actions">
            <button class="btn" id="voterCancel">Annuler</button>
            <button class="btn primary" id="voterSave">Enregistrer</button>
          </div>
        </div>
      </div>`;

    let rows = state.voters.map(v => Object.assign({}, v));

    function renderRows(){
      const wrap = document.getElementById("voterRows");
      wrap.innerHTML = rows.map((v,i)=>`
        <div class="voter-edit-row" data-i="${i}">
          <input type="text" class="v-name" placeholder="Prénom" value="${escapeHtml(v.name)}" maxlength="20">
          <input type="text" class="v-card" placeholder="N° carte off" value="${escapeHtml(v.card||'')}" maxlength="30">
          <button class="icon-btn v-copy" title="Copier ce numéro">📋</button>
          <button class="icon-btn v-remove" title="Retirer" ${rows.length<=1?'disabled':''}>🗑</button>
        </div>`).join("");
      wrap.querySelectorAll(".v-name").forEach((inp,i)=> inp.addEventListener("input", ()=>{ rows[i].name = inp.value; }));
      wrap.querySelectorAll(".v-card").forEach((inp,i)=> inp.addEventListener("input", ()=>{ rows[i].card = inp.value; }));
      wrap.querySelectorAll(".v-copy").forEach((btn,i)=> btn.addEventListener("click", ()=>{
        const cardInput = wrap.querySelectorAll(".v-card")[i];
        copyToClipboard(cardInput.value.trim(), btn);
      }));
      wrap.querySelectorAll(".v-remove").forEach((btn,i)=> btn.addEventListener("click", ()=>{
        if(rows.length<=1) return;
        rows.splice(i,1);
        renderRows();
      }));
    }
    renderRows();

    document.getElementById("voterAddBtn").addEventListener("click", ()=>{
      rows.push({ id: voterUid(), name: "Nouvelle personne", card: "" });
      renderRows();
    });

    document.getElementById("voterCopyAllBtn").addEventListener("click", (e)=>{
      const text = rows
        .filter(v => (v.card||"").trim())
        .slice()
        .sort((a,b)=>a.name.localeCompare(b.name))
        .map(v => `${v.name}: ${v.card.trim()}`)
        .join("\n");
      if(!text){ alert("Aucun numéro de carte renseigné pour l'instant."); return; }
      copyToClipboard(text, e.currentTarget);
    });

    document.getElementById("voterCancel").addEventListener("click", closeModal);
    document.getElementById("voterSave").addEventListener("click", async ()=>{
      state.voters = rows.map(v => ({ id: v.id, name: (v.name||"").trim() || "Perso", card: (v.card||"").trim() }));
      if(!state.voters.some(v=>v.id===state.currentVoter)) state.currentVoter = state.voters[0].id;
      await saveVoters();
      renderVoterSelect();
      renderCards();
      closeModal();
    });
    document.getElementById("voterOverlay").addEventListener("click", (e)=>{ if(e.target.id==="voterOverlay") closeModal(); });
  }

  // ---------- add/edit show modal ----------
  function openShowModal(id){
    const show = id ? state.shows.find(s=>s.id===id) : null;
    const root = document.getElementById("modalRoot");

    const dayOptionsChecks = DAYS.map(d=>`
      <label><input type="checkbox" class="day-check" value="${d.key}" ${show? (show.day===d.key?'checked':'') : (d.key===state.currentDay?'checked':'')} ${show?'disabled':''}> ${d.label}</label>
    `).join("");

    root.innerHTML = `
      <div class="overlay" id="showOverlay">
        <div class="modal">
          <h2>${show? "Modifier le spectacle" : "Ajouter un spectacle"}</h2>
          <div class="sub">${show? "" : "Saisis les infos toi-même, ou pars d'une photo de flyer."}</div>

          <div class="tabs">
            <button class="tab-btn active" data-tab="manual">Saisie manuelle</button>
            <button class="tab-btn" data-tab="photo">Photo d'un flyer</button>
          </div>

          <div id="tab-photo" class="hidden">
            <div class="photo-drop" id="photoDrop">📷 Cliquer pour prendre une photo ou choisir une image<br><span style="font-size:11px;">Tu pourras remplir les champs ci-dessous, ou laisser vide et compléter plus tard.</span></div>
            <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">
            <img id="photoPreview" class="photo-preview hidden">
            <div class="sub" id="extractStatus" style="margin-top:8px;"></div>
          </div>

          <div class="field">
            <label>Jour(s)</label>
            <div class="daychecks">${dayOptionsChecks}</div>
          </div>
          <div class="field"><label>Nom du spectacle *</label><input type="text" id="f_name" value="${show?escapeHtml(show.name):''}" required></div>
          <div class="field-row">
            <div class="field" style="max-width:110px;"><label>Heure</label><input type="time" id="f_time" value="${show?(show.time||''):''}"></div>
            <div class="field" style="max-width:110px;"><label>Durée</label><input type="text" id="f_duration" placeholder="1h15" value="${show?escapeHtml(show.duration||''):''}"></div>
          </div>
          <div class="field"><label>Théâtre</label>
            <input type="text" id="f_theatre" list="theatreOptions" placeholder="Commence à taper…" value="${show?escapeHtml(show.theatre||''):''}">
            <datalist id="theatreOptions">
              ${state.theatres.map(t=>`<option value="${escapeHtml(t.name)}">`).join("")}
            </datalist>
          </div>
          <div class="field"><label>Adresse</label><input type="text" id="f_address" value="${show?escapeHtml(show.address||''):''}"></div>
          <div class="sub" id="theatreHint" style="margin-top:-8px; margin-bottom:12px;"></div>
          <div class="field"><label>Lien de réservation</label><input type="url" id="f_link" placeholder="https://…" value="${show?escapeHtml(show.link||''):''}"></div>
          <div class="field"><label>Résumé (optionnel)</label><textarea id="f_summary" rows="3" placeholder="Quelques phrases sur le spectacle…">${show?escapeHtml(show.summary||''):''}</textarea></div>

          <div class="modal-actions">
            <button class="btn" id="showCancel">Annuler</button>
            <button class="btn primary" id="showSave">${show? "Enregistrer":"Ajouter"}</button>
          </div>
        </div>
      </div>`;

    let pendingPhotoBlob = null;
    let matchedTheatre = show ? findTheatre(show.theatre) : null;

    function findTheatre(name){
      const key = (name||"").trim().toLowerCase();
      return state.theatres.find(t => t.name.trim().toLowerCase() === key) || null;
    }

    function applyTheatreMatch(){
      const typed = document.getElementById("f_theatre").value;
      const hint = document.getElementById("theatreHint");
      const match = findTheatre(typed);
      matchedTheatre = match;
      if(match){
        document.getElementById("f_address").value = match.address || "";
        hint.textContent = "Théâtre déjà connu — adresse complétée automatiquement.";
      } else if(typed.trim()){
        hint.textContent = "Nouveau théâtre — il sera enregistré avec l'adresse ci-dessous.";
      } else {
        hint.textContent = "";
      }
    }
    document.getElementById("f_theatre").addEventListener("input", applyTheatreMatch);
    if(matchedTheatre) applyTheatreMatch();

    root.querySelectorAll(".tab-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        root.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const isPhoto = btn.dataset.tab === "photo";
        document.getElementById("tab-photo").classList.toggle("hidden", !isPhoto);
      });
    });

    document.getElementById("photoDrop").addEventListener("click", ()=> document.getElementById("photoInput").click());
    document.getElementById("photoInput").addEventListener("change", async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const blob = await resizeImageFile(file);
        pendingPhotoBlob = blob;
        const preview = document.getElementById("photoPreview");
        preview.src = URL.createObjectURL(blob);
        preview.classList.remove("hidden");
        document.getElementById("extractStatus").textContent = "";
        await runExtraction();
      }catch(err){
        console.error(err);
        alert("Impossible de lire cette photo, réessaie.");
      }
    });

    async function runExtraction(){
      const status = document.getElementById("extractStatus");
      if(!pendingPhotoBlob){ return; }
      if(typeof Tesseract === "undefined"){
        status.textContent = "L'outil d'extraction n'a pas pu se charger (connexion internet ?). Remplis les champs manuellement.";
        return;
      }
      status.textContent = "Analyse de la photo en cours… (peut prendre 10-20 secondes)";
      try{
        const result = await Tesseract.recognize(pendingPhotoBlob, "fra");
        const text = result.data.text || "";

        let found = [];

        // Nom du spectacle : on suppose que c'est la ligne au texte le plus "gros" (grande hauteur),
        // typiquement le titre en haut d'une affiche.
        const lines = (result.data.lines || [])
          .filter(l => l.text && l.text.trim().replace(/[^a-zA-ZÀ-ÿ]/g,"").length >= 3)
          .map(l => ({ text: l.text.trim(), height: (l.bbox ? (l.bbox.y1 - l.bbox.y0) : 0) }));
        if(lines.length && !document.getElementById("f_name").value.trim()){
          lines.sort((a,b)=> b.height - a.height);
          const guess = lines[0].text.replace(/\s+/g," ").trim();
          if(guess.length >= 3 && guess.length <= 60){
            document.getElementById("f_name").value = guess;
            found.push("nom (à vérifier)");
          }
        }

        // Lien de réservation : cherche une URL dans le texte
        const urlMatch = text.match(/https?:\/\/[^\s]+/i);
        if(urlMatch && !document.getElementById("f_link").value.trim()){
          document.getElementById("f_link").value = urlMatch[0].replace(/[.,)]+$/,"");
          found.push("lien");
        }

        // Théâtre : cherche un nom de théâtre déjà connu dans le texte extrait
        const lower = text.toLowerCase();
        const theatreMatch = state.theatres.find(t => t.name && lower.includes(t.name.toLowerCase()));
        if(theatreMatch){
          document.getElementById("f_theatre").value = theatreMatch.name;
          applyTheatreMatch();
          found.push("théâtre");
        }

        // Heure et durée : cherche les motifs du type "20h30", "1h15", "45min"
        const timeMatches = [...text.matchAll(/\b([01]?\d|2[0-3])\s*[hH]\s*([0-5]\d)?\b/g)];
        const durationMatches = [...text.matchAll(/\b(\d)\s*[hH]\s*(\d{2})?\b|\b(\d{2,3})\s*min\b/g)];

        if(timeMatches.length && !document.getElementById("f_time").value){
          const m = timeMatches[0];
          const hh = String(m[1]).padStart(2,"0");
          const mm = m[2] || "00";
          document.getElementById("f_time").value = `${hh}:${mm}`;
          found.push("heure (à vérifier)");
        }
        if(durationMatches.length && !document.getElementById("f_duration").value){
          const dm = durationMatches.find(m => m[0] !== (timeMatches[0]?timeMatches[0][0]:null));
          if(dm) { document.getElementById("f_duration").value = dm[0].replace(/\s+/g,""); found.push("durée (à vérifier)"); }
        }

        status.textContent = found.length
          ? "Détecté automatiquement : " + found.join(", ") + ". Vérifie ces champs (l'OCR n'est pas parfait) et complète le reste."
          : "Rien de reconnu avec certitude sur cette photo, remplis les champs manuellement.";
      }catch(err){
        console.error(err);
        status.textContent = "Échec de l'analyse — remplis les champs manuellement.";
      }
    }


    document.getElementById("showOverlay").addEventListener("click", (e)=>{ if(e.target.id==="showOverlay") closeModal(); });

    document.getElementById("showSave").addEventListener("click", async ()=>{
      const name = document.getElementById("f_name").value.trim();
      if(!name){ alert("Le nom du spectacle est obligatoire."); return; }
      const theatreName = document.getElementById("f_theatre").value.trim();
      const addressTyped = document.getElementById("f_address").value.trim();
      const finalMatch = findTheatre(theatreName);
      const sameAddress = finalMatch && (finalMatch.address||"").trim() === addressTyped;
      const lat = sameAddress ? finalMatch.lat : null;
      const lng = sameAddress ? finalMatch.lng : null;

      const common = {
        name,
        time: document.getElementById("f_time").value,
        duration: document.getElementById("f_duration").value.trim(),
        theatre: theatreName,
        address: addressTyped,
        link: document.getElementById("f_link").value.trim(),
        summary: document.getElementById("f_summary").value.trim(),
        address_unsure: false,
        lat, lng
      };

      const saveBtn = document.getElementById("showSave");
      saveBtn.disabled = true; saveBtn.textContent = "Enregistrement…";

      if(theatreName){
        if(!finalMatch){
          const newTheatre = { name: theatreName, address: addressTyped, address_unsure: false, lat: null, lng: null };
          await upsertTheatre(newTheatre);
          state.theatres.push(newTheatre);
        } else if((finalMatch.address||"") !== addressTyped){
          finalMatch.address = addressTyped;
          finalMatch.lat = null;
          finalMatch.lng = null;
          await upsertTheatre(finalMatch);
        }
      }

      if(show){
        let photo_url = show.photo_url;
        if(pendingPhotoBlob) photo_url = await uploadPhoto(show.id, pendingPhotoBlob);
        const fields = Object.assign({}, common, { photo_url });
        await updateShow(show.id, fields);
        Object.assign(show, fields);
      } else {
        const days = Array.from(root.querySelectorAll(".day-check:checked")).map(c=>c.value);
        if(days.length===0){ alert("Choisis au moins un jour."); saveBtn.disabled=false; saveBtn.textContent="Ajouter"; return; }
        for(const day of days){
          const newId = uid();
          let photo_url = null;
          if(pendingPhotoBlob) photo_url = await uploadPhoto(newId, pendingPhotoBlob);
          const newShow = Object.assign({}, common, { id:newId, day, photo_url });
          await insertShow(newShow);
          state.shows.push(newShow);
        }
      }
      renderDayTabs();
      renderTheatreFilter();
      renderCards();
      closeModal();
    });
  }

  function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

  function resizeImageFile(file, maxDim, quality){
    maxDim = maxDim || 1000; quality = quality || 0.72;
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = ()=>{
        const img = new Image();
        img.onerror = reject;
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
          else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => resolve(blob), "image/jpeg", quality);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  init();
})();
</script>
</body>
